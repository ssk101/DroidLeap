[package]
name = "droidleap"
version = "0.5.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
futures-util = "0.3.34"
jiff = "0.2.39"
mdns-sd = "0.21.7"
nusb = { version = "0.2.9", features = ["tokio"] }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "signal", "sync", "net", "io-util"] }
toml = "1.1.8"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", features = ["input_capture"] }
ksni = "0.3.7"
reis = { version = "0.7.1", features = ["tokio"] }

[target."cfg(windows)".dependencies]
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_System_Threading"] }

[build-dependencies]
embed-manifest = "1.5.1"
