# Tablet Edge settings. Keep this file next to tablet-edge.exe.
# Changes apply within ~2 seconds; the Settings dialog edits this file too.
[tablet-edge]
# Which outer edge of the whole desktop hands the mouse to the tablet:
# left | right | top | bottom
side=left

# Accumulated push in raw mouse counts within timeout_ms needed to trigger.
# Raw counts depend on mouse DPI; raise this if it triggers too easily.
threshold=400
timeout_ms=1000

# Dead zone in pixels at both ends of the edge.
corner_margin=0

# Tablet USB serial (leave empty if only one Android device is plugged in).
serial=

# scrcpy.exe from the official Windows release:
# https://github.com/Genymobile/scrcpy/releases
# A bare name is looked up on PATH; otherwise give the full path.
scrcpy=scrcpy.exe
