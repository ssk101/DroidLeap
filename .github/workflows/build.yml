name: Build

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # "closed" also fires for PRs that were closed without merging.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit that landed on master, not the PR's merge preview ref.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build tablet-edge.exe
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tablet-edge-windows-x64
          path: |
            tablet-edge.exe
            tablet-edge.ini
            README.md
            LICENSE
          if-no-files-found: error
